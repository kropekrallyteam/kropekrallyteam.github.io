<script>
  const v=document.getElementById('film'),b=document.getElementById('dzwiek');
  const opis=()=>{b.textContent=v.muted?'🔇 WŁĄCZ DŹWIĘK':'🔊 WYCISZ';};
  b.addEventListener('click',()=>{v.muted=!v.muted;if(!v.muted)v.play().catch(()=>{});opis();});
  v.addEventListener('volumechange',opis);
  v.play().catch(()=>{});   /* wyciszony film może ruszyć sam */
  /* otwarte z gry: przycisk wraca do karty z grą i zamyka tę kartę (bez drugiej kopii gry); otwarte z linku (np. Facebook): zwykłe przejście do gry */
  const g=document.getElementById('doGry');let gra=null;try{if(window.opener&&!window.opener.closed&&window.opener.location.host===location.host)gra=window.opener;}catch(e){}
  if(gra){g.textContent='WRÓĆ DO GRY ✕';g.addEventListener('click',e=>{e.preventDefault();try{gra.focus();}catch(x){}window.close();setTimeout(()=>{location.href='./';},300);});}
